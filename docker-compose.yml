services:
  ai-readiness-webapp:
    build: .
    ports:
      - "8080:8080"
    environment:
      - AUDIT_TIMEOUT_SECONDS=30
      - AUDIT_EXECUTOR_POOL_SIZE=8
      - AUDIT_RATE_LIMIT_PER_MINUTE=20
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
